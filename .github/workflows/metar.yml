name: Refresh UK airport METARs
on:
  push:
    paths:
      - '.github/workflows/metar.yml'
      - 'weather-update.py'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest NOAA METARs
        run: python3 weather-update.py
      - name: Save updated reports
        run: |
          if ! git diff --quiet -- weather.json; then
            git config user.name 'Line Logic weather'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add weather.json
            git commit -m 'Refresh UK airport METARs'
            git push
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
