name: Build traffic animation

on:
  push:
    branches:
      - main
    paths:
      - tools/build_traffic_animation.py
      - .github/workflows/build-traffic-animation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Render browser-compatible MP4
        run: python tools/build_traffic_animation.py

      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/traffic-compression.mp4 assets/traffic-compression-poster.png
          if git diff --cached --quiet; then
            echo "Animation is already current."
          else
            git commit -m "Build Line Logic traffic animation [skip ci]"
            git push
          fi
