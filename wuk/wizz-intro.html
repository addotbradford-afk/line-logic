*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#171717;font-family:Arial,sans-serif}main{min-height:100svh;display:grid;place-content:center;padding:24px}.stage{width:min(1100px,94vw);background:white;position:relative;aspect-ratio:16/10;overflow:hidden}svg{display:block;width:100%;height:100%}.drawing{fill:none;stroke:#26343d;stroke-width:1.8;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:3}.drawing path,.drawing circle,.drawing rect,.drawing ellipse{vector-effect:non-scaling-stroke}.element#aircraft .drawing{stroke-width:1.4;transform:scale(1.22,1.08)}.drawing .accent{fill:#e0e3e5}.drawing .white{fill:white}.drawing .pencil-shaft{fill:#e0e3e5}.drawing .pencil-top{fill:#c85d65}.drawing .crew-tie{fill:#cf6897;stroke:#cf6897;stroke-width:1}.drawing .sun-disc{fill:white}.drawing .sun-rays{stroke:#777}.drawing .raindrop{stroke:#9aa7af;stroke-width:1.3;stroke-linecap:round}.drawing .signal{stroke:#58ae78;fill:#a5e0b6}.drawing .taxi-dot{fill:#35a45a;stroke:none}.label{font-size:11px;letter-spacing:3px;fill:#777;text-anchor:middle}.logo{opacity:0}.logo image{mix-blend-mode:multiply}.brand{font-size:39px;font-weight:400;letter-spacing:9px;text-anchor:middle;fill:#171717}.tag{font-size:10px;letter-spacing:4px;fill:#777;text-anchor:middle}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 0;font-size:11px;letter-spacing:2px;color:#666}.controls{display:flex;gap:8px}button{background:transparent;border:1px solid #ccc;border-radius:30px;color:#333;padding:11px 17px;cursor:pointer;font:inherit;letter-spacing:1px}button:hover{background:#eee}button:focus-visible{outline:2px solid #111;outline-offset:3px}.track{height:2px;background:#e8e6e1}.track span{display:block;height:100%;background:#111;width:0} @media(max-width:600px){main{padding:12px}.stage{width:96vw;aspect-ratio:1/1}.toolbar{letter-spacing:1px;font-size:10px}}

</main><script>
const duration=6500;const elements=['crew','aircraft','tower','weather','paper'].map(id=>document.getElementById(id));const logo=document.querySelector('#logo');const progress=document.querySelector('#progress');const pause=document.querySelector('#pause');let start=performance.now(),elapsed=0,playing=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const clamp=x=>Math.max(0,Math.min(1,x));const smooth=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
elements.forEach(el=>el.querySelectorAll('.drawing path,.drawing circle,.drawing rect,.drawing ellipse').forEach(p=>{if(!p.classList.contains('taxi-line')&&!p.classList.contains('taxi-dot')){p.setAttribute('pathLength','1');p.style.strokeDasharray='1';p.style.strokeDashoffset='1'}}));
function render(t){const actualTime=t;t=t*(12500/6200);elements.forEach((el,i)=>{const revealStart=100+i*450,localTime=actualTime-revealStart,appear=clamp(localTime/300),action=clamp((localTime-100)/500),merge=smooth((actualTime-2850)/1050);const x=500+(+el.dataset.x-500)*.8,y=310+(+el.dataset.y-310)*.8;el.setAttribute('transform',`translate(${x+(500-x)*merge*1.4} ${y+(310-y)*merge*1.4}) scale(${.578*(1-.25*merge)})`);el.style.opacity=smooth(localTime/250)*(1-smooth((actualTime-2800)/650));el.querySelectorAll('.drawing path,.drawing circle,.drawing rect,.drawing ellipse').forEach((p,j)=>{if(!p.classList.contains('taxi-line')&&!p.classList.contains('taxi-dot'))p.style.strokeDashoffset=1-clamp((appear-j*.018)/.8);if(p.classList.contains('accent')||p.classList.contains('white'))p.style.fillOpacity=smooth((appear-.35)/.6)});
const ease=smooth(action);
if(el.id==='paper'){const pen=el.querySelector('.pen-motion');const wave=Math.sin(action*Math.PI*4)*Math.sin(action*Math.PI)*(1-ease);pen.setAttribute('transform',`translate(${wave*8} ${wave*3}) rotate(${wave*5} 27 4) translate(27 4) scale(.75) translate(-27 -4)`);el.querySelector('.scribble').style.strokeDashoffset=1-ease;}
if(el.id==='crew'){el.querySelector('.crew-left').setAttribute('transform',`translate(${44*(1-ease)} 0)`);el.querySelector('.crew-right').setAttribute('transform',`translate(${-44*(1-ease)} 0)`);}
if(el.id==='tower'){el.querySelector('.beacon').style.opacity=(action>0&&action<1)?Math.pow(Math.sin(action*Math.PI*2),2):0;}
if(el.id==='aircraft'){const q=smooth(action),theta=q*Math.PI/2;const tx=-60+60*Math.sin(theta),ty=60*Math.cos(theta),angle=90*(1-q);el.querySelector('.taxi-plane').setAttribute('transform',`translate(${tx} ${ty}) rotate(${angle})`);el.querySelector('.taxi-line').style.opacity=smooth(localTime/200)*.9;}
if(el.id==='weather'){el.querySelectorAll('.raindrop').forEach((drop,j)=>{const rainTime=Math.max(0,localTime-180-(j%4)*80-Math.floor(j/4)*120),phase=(rainTime%650)/650;drop.style.opacity=localTime>180+(j%4)*80+Math.floor(j/4)*120?smooth(phase/.18)*(1-smooth((phase-.72)/.28)):0;drop.setAttribute('transform',`translate(0 ${(j===1?-10:0)-18+phase*36})`)});el.querySelector('.sun-motion').setAttribute('transform',`translate(${22*(1-ease)} ${35*(1-ease)})`);el.querySelector('.sun-rays').style.opacity=ease;el.querySelector('.sun-rays').style.strokeWidth=2+Math.sin(action*Math.PI*4)*(1-ease);}
});const reveal=smooth((actualTime-3150)/500);logo.style.opacity=reveal;logo.setAttribute('transform','translate(0 0)');document.querySelector('#ll-mark').style.opacity=1;document.querySelector('#ll-mark').style.fillOpacity=smooth((actualTime-4000)/750);document.querySelector('#right-l').style.fillOpacity=1;document.querySelector('.tag').style.opacity=smooth((actualTime-5050)/250);progress.style.width=`${clamp(actualTime/duration)*100}%`;}
function tick(now){if(playing){elapsed=Math.min(duration,now-start);render(elapsed);if(elapsed===duration){playing=false;pause.textContent='Play';document.querySelector('#status').textContent='LINE LOGIC / ALL TOGETHER';parent.postMessage('lineLogicIntroComplete',location.protocol==='file:'?'*':location.origin)}}requestAnimationFrame(tick)}
function replay(){start=performance.now();elapsed=0;playing=true;pause.textContent='Pause';document.querySelector('#status').textContent='LINE LOGIC / INTRO STUDY 01';render(0)}document.querySelector('#replay').onclick=replay;pause.onclick=()=>{if(elapsed===duration){replay();return}playing=!playing;if(playing)start=performance.now()-elapsed;pause.textContent=playing?'Pause':'Play'};if(reduced){elapsed=duration;playing=false;pause.textContent='Play';render(duration);parent.postMessage('lineLogicIntroComplete',location.protocol==='file:'?'*':location.origin)}else render(0);requestAnimationFrame(tick);
</script></body></html>
