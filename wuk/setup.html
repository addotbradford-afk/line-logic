<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account setup | Line Logic</title><link rel="icon" href="assets/line-logic-icon.svg?v=wizz1"><link rel="stylesheet" href="landing.css"><link rel="stylesheet" href="site-header.css"><link rel="stylesheet" href="wizz-theme.css"><link rel="stylesheet" href="account-pages.css"></head><body><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="./?home=1"><img src="assets/line-logic-icon.svg?v=wizz1" alt=""><strong>LINE LOGIC</strong></a><div class="site-header-actions"><div class="site-session-slot"></div><a class="site-home-link" href="./?home=1">Home</a></div></div></header><main class="account-page"><section class="account-panel"><p class="account-eyebrow">YOUR LINE LOGIC ACCOUNT</p><h1>Welcome aboard.</h1><p>Complete your details to start your training.</p><form id="setupForm" hidden><label for="firstName">First name</label><input id="firstName" autocomplete="given-name" maxlength="80" required><label for="surname">Surname</label><input id="surname" autocomplete="family-name" maxlength="80" required><label for="setupEmail">Email</label><input id="setupEmail" type="email" readonly autocomplete="email"><label for="setupPassword">Choose a password</label><input id="setupPassword" type="password" autocomplete="new-password" minlength="8" required><label for="setupConfirm">Confirm password</label><input id="setupConfirm" type="password" autocomplete="new-password" minlength="8" required><button class="account-action" type="submit">Create my account</button></form><form id="requestSetupForm" hidden><label for="requestSetupEmail">Your invited email address</label><input id="requestSetupEmail" type="email" autocomplete="email" required><button class="account-action" type="submit">Send a new setup link</button></form><p id="setupMessage" role="status">Checking your invitation…</p><a id="setupLogin" href="./?login
