<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line Logic Finder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body><div class="app">
<div class="search"><input id="q" type="search" aria-label="Search scenarios" placeholder="Search airport, topic, phase, keyword..."><span aria-hidden="true">⌕</span></div>
<div class="filters">
<div class="box"><small>OPERATIONAL FOCUS</small><select id="focus"><option value="">All operational areas</option></select></div>
<div class="box"><small>PILOT COMPETENCY</small><details><summary id="summary">All competencies ▾</summary><div class="menu" id="menu"></div></details></div>
<button class="clear" id="clear" type="button">CLEAR</button>
</div>
<div class="meta"><div class="count" id="count" aria-live="polite"></div><div class="chips" id="chips"></div></div>
<div class="results" id="results"></div>
</div>
<div class="modal" id="modal" hidden>
<div class="modal-shade" data-close></div>
<section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
<button class="modal-close" type="button" data-close aria-label="Close scenario preview">×</button>
<div id="modal-content"></div>
</section>
</div>
<script src="scenarios.js"></script><script src="app.js"></script>
</body></html>
